[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dash-social-signin"
version = "0.1.0"
description = "Social sign-in helpers for Dash (frontend assets + verification)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "Osakpolor Emmanuel Omonbude" }
]
dependencies = [
  "dash>=2.10",
  "python-dotenv>=1.0",
  "requests>=2.31"
]
keywords = ["dash", "oauth", "social", "signin", "frontend"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only"
]

[project.urls]
Homepage = "https://github.com/budescode/dash-social-signin"
Issues = "https://github.com/budescode/dash-social-signin/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dash_social_signin = ["assets/*.js", "assets/*.css"]
